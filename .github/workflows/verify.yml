name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 产品验证：静态架构检查 + 全量测试 + 产品实战验收（零依赖，纯 Node）
      - name: Verify
        run: npm run verify
